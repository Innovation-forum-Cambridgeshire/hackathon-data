# Challenge 01 — One Farm, One Picture (AgTech data)
#
# See catalogue/c02-mapping-the-gaps.yml for the fully worked example and the reasoning
# behind the `redistributable` / `licence_reviewed` gates. The build refuses to mirror
# bytes for any source that has not cleared both.

challenge: c01-one-farm-one-picture
title: One Farm, One Picture
domain: AgTech data
event_date: 2027-06-01
publisher: Innovation Forum
contact: info@inno-forum.co.uk


attribution: >-
  Contains public sector information licensed under the Open Government Licence v3.0. Contains modified Copernicus Sentinel data.


handle_with_care: >-
  Sensor data is often miscalibrated, duplicated or missing. Strong entries surface data
  quality rather than hiding it behind a clean-looking chart.


sensitivity:
  personal_data: false
  special_category: false
  note: >-
    Farm business data is commercially sensitive — use published/open sources only, never a
    named holding.


sources:
  - id: copernicus-sentinel
    provenance: real
    name: Copernicus / Sentinel
    publisher: European Space Agency
    url: https://dataspace.copernicus.eu/
    licence: review-required
    redistributable: false
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: tiff
    notes: >-
      Far too large to mirror — a single tile dwarfs the whole release budget. Ship
      loader code and a pointer, plus a small pre-computed NDVI extract for the study
      area once licensing is confirmed.
  - id: midas-open
    provenance: real
    name: Met Office MIDAS Open
    publisher: Met Office / CEDA
    url: https://catalogue.ceda.ac.uk/
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: true # D4 cleared 2026-08-15
    licence_evidence: >-
      CEDA catalogue record for MIDAS Open, checked 2026-08-15: "All of these data are
      provided under an Open Government Licence." Note this clears the LICENCE, not
      access — CEDA may still require an account for bulk download. Access friction and
      redistribution rights are separate questions and only the second one gates
      mirroring.   # D4 — blocks mirroring until true
    format: csv
    approx_size_mb: 1200
    notes: >-
      Requires a free CEDA account to fetch, but the data is OGL. Mirror a curated
      station subset, not the national archive.
  # REVIEWED 2026-08-15 AND DELIBERATELY NOT CLEARED — this one is a trap.
  #
  # The platform-level licence checks out: environment.data.gov.uk states OGL v3.0.
  # It also says "except where otherwise stated", and this entry bundles three
  # different datasets behind one flag, one of which is the problem:
  #
  #   FIELD BOUNDARIES are derived from Ordnance Survey MasterMap. RPA/Defra parcel
  #   data carries OS derived-data conditions, and OS-derived material is exactly the
  #   category the platform's "except where otherwise stated" is there to carve out.
  #   Mirroring it as plain OGL could breach OS licensing at scale and publicly.
  #
  # Soils and water are very likely fine. Clearing all three together because two of
  # them are fine is how the Met Office error happened, so: SPLIT THIS into one source
  # per dataset and review each. Soils and water should clear quickly; field
  # boundaries need the OS position confirmed, and may need to stay pointer-only.
  #
  # Compare `ons-geography` in c02, which IS cleared but carries an explicit
  # "Contains OS data (c) Crown copyright and database right 2026" attribution and a
  # do-not-mirror note on postcode and UPRN products. That is the shape this needs.
  - id: defra
    provenance: real
    name: Defra data (soils, water, field boundaries)
    publisher: Defra
    url: https://environment.data.gov.uk/
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: false   # D4 — see the comment above; do NOT flip without splitting
    format: geojson
    approx_size_mb: 450
    notes: >-
      BUNDLES THREE DATASETS behind one licence flag. Reviewed 2026-08-15 and held:
      field boundaries are OS-derived and need the Ordnance Survey position confirmed
      before any mirroring. Split per dataset before clearing.
  - id: ahdb
    provenance: real
    name: AHDB market intelligence
    publisher: AHDB
    url: https://ahdb.org.uk/
    licence: review-required
    redistributable: false
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: csv
    approx_size_mb: 20
    notes: >-
      Levy-body data behind a free account. Redistribution rights unconfirmed — one of
      the three sources named in decision D4.

gold_tables:
  - name: field_daily
    description: Daily weather joined to field-level NDVI and soil type.
    grain: One row per field × day
    approx_rows: 180000
    csv_twin: true
  - name: station_weather
    description: Cleaned MIDAS station observations.
    grain: One row per station × day
    approx_rows: 900000
    csv_twin: true
  - name: market_prices
    description: Commodity prices for real-world context.
    grain: One row per commodity × week
    approx_rows: 5200
    csv_twin: true
    blocked_by: ahdb

documents:
  - id: midas-user-guide
    name: MIDAS Open user guide
    format: pdf
    url: https://catalogue.ceda.ac.uk/
    extract_markdown: true
    chunk: true
