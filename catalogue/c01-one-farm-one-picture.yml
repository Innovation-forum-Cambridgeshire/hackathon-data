# Challenge 01 — One Farm, One Picture (AgTech data)
#
# See catalogue/c02-mapping-the-gaps.yml for the fully worked example and the reasoning
# behind the `redistributable` / `licence_reviewed` gates. The build refuses to mirror
# bytes for any source that has not cleared both.

challenge: c01-one-farm-one-picture
title: One Farm, One Picture
domain: AgTech data
event_date: 2027-06-01
publisher: Innovation Forum
contact: info@inno-forum.co.uk


attribution: >-
  Contains public sector information licensed under the Open Government Licence v3.0. Contains modified Copernicus Sentinel data.


handle_with_care: >-
  Sensor data is often miscalibrated, duplicated or missing. Strong entries surface data
  quality rather than hiding it behind a clean-looking chart.


sensitivity:
  personal_data: false
  special_category: false
  note: >-
    Farm business data is commercially sensitive — use published/open sources only, never a
    named holding.


sources:
  - id: synthetic-farm
    provenance: synthetic
    name: Synthetic farm and station corpus
    publisher: Innovation Forum x R1X
    url: https://github.com/Innovation-forum-Cambridgeshire/hackathon-data
    licence: CC0-1.0
    redistributable: true
    licence_reviewed: true
    licence_evidence: >-
      Authored by Innovation Forum x R1X and released by us under CC0-1.0. No
      third-party rights subsist: generated by a seeded generator in this
      repository, not collected, so there is no upstream licensor to clear.
      Recorded 2026-08-15.
    generator: synthetic_farm   # build/generators/synthetic_farm.py
    format: parquet
    approx_size_mb: 120
    notes: >-
      STAND-IN, added 2026-08-15. c01's own sources are either real-and-unfetched
      (midas-open, cleared but no fetcher) or held (defra needs a per-dataset split
      because field boundaries are OS-derived; ahdb and copernicus-sentinel are
      pointer-only). This corpus is modelled on the SHAPE of the intended join so
      schemas and notebooks exist now, and is deliberately dirty because the
      challenge is about surfacing data quality.
  - id: copernicus-sentinel
    provenance: real
    name: Copernicus / Sentinel
    publisher: European Space Agency
    url: https://dataspace.copernicus.eu/
    licence: review-required
    redistributable: false
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: tiff
    notes: >-
      Far too large to mirror — a single tile dwarfs the whole release budget. Ship
      loader code and a pointer, plus a small pre-computed NDVI extract for the study
      area once licensing is confirmed.
  - id: midas-open
    provenance: real
    name: Met Office MIDAS Open
    publisher: Met Office / CEDA
    url: https://catalogue.ceda.ac.uk/
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: true # D4 cleared 2026-08-15
    licence_evidence: >-
      CEDA catalogue record for MIDAS Open, checked 2026-08-15: "All of these data are
      provided under an Open Government Licence." Note this clears the LICENCE, not
      access — CEDA may still require an account for bulk download. Access friction and
      redistribution rights are separate questions and only the second one gates
      mirroring.
    format: csv
    approx_size_mb: 1200
    notes: >-
      Requires a free CEDA account to fetch, but the data is OGL. Mirror a curated
      station subset, not the national archive.
  # REVIEWED 2026-08-15 AND DELIBERATELY NOT CLEARED — this one is a trap.
  #
  # The platform-level licence checks out: environment.data.gov.uk states OGL v3.0.
  # It also says "except where otherwise stated", and this entry bundles three
  # different datasets behind one flag, one of which is the problem:
  #
  #   FIELD BOUNDARIES are derived from Ordnance Survey MasterMap. RPA/Defra parcel
  #   data carries OS derived-data conditions, and OS-derived material is exactly the
  #   category the platform's "except where otherwise stated" is there to carve out.
  #   Mirroring it as plain OGL could breach OS licensing at scale and publicly.
  #
  # Soils and water are very likely fine. Clearing all three together because two of
  # them are fine is how the Met Office error happened, so: SPLIT THIS into one source
  # per dataset and review each. Soils and water should clear quickly; field
  # boundaries need the OS position confirmed, and may need to stay pointer-only.
  #
  # Compare `ons-geography` in c02, which IS cleared but carries an explicit
  # "Contains OS data (c) Crown copyright and database right 2026" attribution and a
  # do-not-mirror note on postcode and UPRN products. That is the shape this needs.
  - id: defra
    provenance: real
    name: Defra data (soils, water, field boundaries)
    publisher: Defra
    url: https://environment.data.gov.uk/
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: false   # D4 — see the comment above; do NOT flip without splitting
    format: geojson
    approx_size_mb: 450
    notes: >-
      BUNDLES THREE DATASETS behind one licence flag. Reviewed 2026-08-15 and held:
      field boundaries are OS-derived and need the Ordnance Survey position confirmed
      before any mirroring. Split per dataset before clearing.
  - id: ahdb
    provenance: real
    name: AHDB market intelligence
    publisher: AHDB
    url: https://ahdb.org.uk/
    licence: review-required
    redistributable: false
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: csv
    approx_size_mb: 20
    notes: >-
      Levy-body data behind a free account. Redistribution rights unconfirmed — one of
      the three sources named in decision D4.

gold_tables:
  # BOTH TABLES ARE SYNTHETIC STAND-INS, and both are DELIBERATELY DIRTY.
  #
  # `midas-open` is licence-cleared but real and has no fetcher; `defra` is held
  # pending a per-dataset split (field boundaries are OS-derived). So these are
  # modelled on the SHAPE of the intended join so that schemas, notebooks and team
  # tooling exist now — swapping in the real CEDA extract later is a fetcher
  # change, not a redesign.
  #
  # The dirt is the challenge, per this catalogue's own handle_with_care:
  # "Sensor data is often miscalibrated, duplicated or missing. Strong entries
  # surface data quality rather than hiding it behind a clean-looking chart."
  # A clean corpus would make that instruction meaningless.
  - name: field_daily
    description: >-
      Daily field-level NDVI and soil moisture, with the nearest weather station.
      SYNTHETIC stand-in for the intended CEDA/Defra join. NDVI is missing on ~21%
      of field-days and the gaps are CLUSTERED, not random — see the ndvi column.
    grain: One row per field × day
    approx_rows: 180000
    csv_twin: true
    source: synthetic-farm
    columns:
      - { name: field_id,                type: string,  description: "Field identifier." }
      - { name: observation_date,        type: date,    description: "Observation day, ISO-8601." }
      - { name: farm_id,                 type: string,  description: "Owning farm. Several fields per farm, so field-level and farm-level conclusions differ." }
      - { name: crop,                    type: string,  description: "Crop grown that season." }
      - { name: soil_type,               type: string,  description: "Soil classification." }
      - { name: area_ha,                 type: double,  description: "Field area in hectares. Log-normal — a few large fields dominate any unweighted mean." }
      - { name: nearest_station_id,      type: string,  description: "Joins to station_weather.station_id." }
      - { name: distance_to_station_km,  type: double,  description: "Distance to that station, km. Up to 28km — a weather reading 28km away is a much weaker proxy than one at 1km, and nothing else in the data says so." }
      - { name: ndvi,                    type: double,  description: "Vegetation index, 0–1. NULL on ~21% of field-days because cloud blocks optical satellite readings. The gaps run in blocks of 2–14 days, NOT at random: dropping nulls therefore biases the sample toward clear weather, which is hotter and drier than average." }
      - { name: soil_moisture_pct,       type: double,  description: "Soil moisture, percent." }

  - name: station_weather
    description: >-
      Station observations. SYNTHETIC stand-in for MIDAS Open, and deliberately
      UNCLEANED — despite what an earlier description claimed. Contains duplicate
      station-days, stuck sensors, miscalibrated stations and impossible readings.
      Finding them is the exercise.
    grain: >-
      One row per station × day — EXCEPT that it is not, because ~1.5% of
      station-days are duplicated. The grain is what the data SHOULD have; the
      violation is deliberate.
    approx_rows: 913500
    csv_twin: true
    source: synthetic-farm
    columns:
      - { name: station_id,        type: string, description: "Station identifier." }
      - { name: observation_date,  type: date,   description: "Observation day, ISO-8601. NOT unique with station_id — see the grain note." }
      - { name: county,            type: string, description: "County the station sits in." }
      - { name: latitude,          type: double, description: "Latitude, WGS84." }
      - { name: longitude,         type: double, description: "Longitude, WGS84." }
      - { name: temp_max_c,        type: double, description: "Daily maximum, Celsius. Three stations carry a systematic ~2.8C offset that is internally consistent and only visible against neighbours." }
      - { name: temp_min_c,        type: double, description: "Daily minimum, Celsius." }
      - { name: rainfall_mm,       type: double, description: "Daily rainfall, mm." }
      - { name: quality_flag,      type: string, description: "'ok' or 'suspect'. Carries only the defects a real ingest pipeline WOULD have caught — the impossible readings. Duplicates, stuck sensors and miscalibration are all flagged 'ok', because a pipeline that knew about them would have fixed them. Filtering on this column is not cleaning the data." }
  - name: market_prices
    description: Commodity prices for real-world context.
    grain: One row per commodity × week
    approx_rows: 5200
    csv_twin: true
    blocked_by: ahdb

documents:
  - id: midas-user-guide
    name: MIDAS Open user guide
    format: pdf
    url: https://catalogue.ceda.ac.uk/
    extract_markdown: true
    chunk: true
