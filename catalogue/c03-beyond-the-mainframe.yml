# Challenge 03 — Beyond the Mainframe (Enterprise FinOps)
#
# See catalogue/c02-mapping-the-gaps.yml for the fully worked example and the reasoning
# behind the `redistributable` / `licence_reviewed` gates. The build refuses to mirror
# bytes for any source that has not cleared both.

challenge: c03-beyond-the-mainframe
title: Beyond the Mainframe
domain: Enterprise FinOps
event_date: 2026-10-26
publisher: Innovation Forum
contact: info@inno-forum.co.uk


handle_with_care: >-
  Teams work on a SYNTHETIC environment: workloads, cost data, logs and expert scenarios. No
  client systems, no client data. Practitioner mentors contribute knowledge throughout the
  event.


sensitivity:
  personal_data: false
  special_category: false
  note: >-
    Synthetic by construction. No client data may enter this challenge under any
    circumstances.


sources:
  - id: synthetic-finops
    provenance: synthetic
    name: Synthetic FinOps estate
    publisher: Innovation Forum x R1X
    url: https://github.com/Innovation-forum-Cambridgeshire/hackathon-data
    licence: CC0-1.0
    redistributable: true
    licence_reviewed: true    # authored by us under CC0 — no third-party review needed
    format: parquet
    approx_size_mb: 300
    notes: >-
      Generated, not collected. Seeded and reproducible so judging is fair — the
      generator lives in this repo.
  - id: sponsor-lake
    provenance: real
    name: Sponsor data lake and viewer
    publisher: Sponsor
    url: https://example.invalid/sponsor
    licence: review-required
    redistributable: false
    licence_reviewed: false   # D4 — blocks mirroring until true
    notes: >-
      Sponsor-owned and sponsor-hosted with their own accounts. We CATALOGUE it, we do
      not host it. Access is arranged by the sponsor directly with teams.
  - id: finops-open
    provenance: real
    name: Hybrid and cloud usage benchmarks
    publisher: FinOps Foundation
    url: https://www.finops.org/
    licence: CC-BY-4.0
    redistributable: true
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: csv
    approx_size_mb: 8
  - id: sustainability
    provenance: real
    name: Grid carbon intensity signals
    publisher: National Energy System Operator
    url: https://carbonintensity.org.uk/
    licence: CC-BY-4.0
    redistributable: true
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: json
    approx_size_mb: 40

# Gold tables.
#
# `columns` is REQUIRED and is the physical contract: it is what the transform emits,
# what the manifest publishes, and what the build checks the generated frame against.
# Before this existed the tables carried only a name and a grain, which reads like a
# schema but cannot be built against — "one row per workload × day" does not tell you
# whether cost is pounds or pence, or whether the date column is called `date`.
#
# `approx_rows` is now checked against what the generator actually produces (±20%).
# It used to be a guess nobody revisited: chargeback_allocation was declared at 18,000
# and the real roll-up is 8,136, so anyone sizing a download or a demo off the
# catalogue was out by more than half.
gold_tables:
  - name: workload_cost_daily
    description: Synthetic workload cost and utilisation by day, across a hybrid mainframe, on-premises and cloud estate.
    grain: One row per workload × day
    approx_rows: 419750
    csv_twin: true
    source: synthetic-finops
    columns:
      - { name: workload_id,      type: string,  description: "Stable workload identifier, WL-nnnnn." }
      - { name: usage_date,       type: date,    description: "Usage day, ISO-8601." }
      - { name: business_unit,    type: string,  description: "Owning business unit. UNALLOCATED where ownership is untagged — this is deliberate and is a finding, not a defect." }
      - { name: service,          type: string,  description: "Billable service, e.g. CICS Transaction Server, Kubernetes Service." }
      - { name: platform,         type: string,  description: "One of mainframe, distributed, cloud." }
      - { name: environment,      type: string,  description: "One of production, staging, development, test." }
      - { name: region,           type: string,  description: "Deployment region or on-premises site." }
      - { name: vcpu_hours,       type: double,  description: "Compute consumed that day, vCPU-hours (MIPS-equivalent on mainframe)." }
      - { name: memory_gb_hours,  type: double,  description: "Memory consumed that day, GB-hours." }
      - { name: storage_gb,       type: double,  description: "Provisioned storage, GB. Flat per workload." }
      - { name: utilisation_pct,  type: double,  description: "Mean utilisation that day, 0–100." }
      - { name: cost_gbp,         type: double,  description: "Billed cost that day, GBP. Sums exactly to chargeback_allocation." }

  - name: chargeback_allocation
    description: Monthly cost allocation and chargeback by business unit and service. A pure roll-up of workload_cost_daily.
    grain: One row per business unit × month × service
    approx_rows: 8136
    csv_twin: true
    source: synthetic-finops
    columns:
      - { name: business_unit,               type: string,  description: "Owning business unit, or UNALLOCATED." }
      - { name: month,                       type: date,    description: "First day of the month, ISO-8601." }
      - { name: service,                     type: string,  description: "Billable service." }
      - { name: workload_count,              type: integer, description: "Distinct workloads contributing that month." }
      - { name: allocated_cost_gbp,          type: double,  description: "Allocated cost, GBP. Reconciles exactly to workload_cost_daily." }
      - { name: share_of_bu_pct,             type: double,  description: "This service as a percentage of that business unit's spend that month." }
      - { name: variance_vs_prior_month_pct, type: double,  description: "Change on the previous month, percent. NULL in the first month a combination appears — absent, not zero." }

  - name: carbon_by_workload
    description: Estimated carbon per workload per day. Grid intensity is SYNTHETIC — realistic in shape, not a measurement.
    grain: One row per workload × day
    approx_rows: 419750
    csv_twin: true
    source: synthetic-finops
    # NOT blocked_by the `sustainability` source. The real NESO carbon-intensity feed
    # is licence_reviewed: false, so rather than hold this table behind D4 the curve is
    # generated. That keeps c03 deliverable for October, at the cost of the numbers
    # being illustrative — which the description above states on the table itself so it
    # travels with the data rather than living only here.
    columns:
      - { name: workload_id,                 type: string,  description: "Stable workload identifier, joins to workload_cost_daily." }
      - { name: usage_date,                  type: date,    description: "Usage day, ISO-8601." }
      - { name: business_unit,               type: string,  description: "Owning business unit, or UNALLOCATED." }
      - { name: platform,                    type: string,  description: "One of mainframe, distributed, cloud." }
      - { name: energy_kwh,                  type: double,  description: "Estimated energy for that workload-day, kWh." }
      - { name: grid_intensity_gco2_per_kwh, type: double,  description: "SYNTHETIC grid carbon intensity, gCO2e/kWh. Do not report findings against the real grid." }
      - { name: carbon_kg,                   type: double,  description: "Estimated emissions, kgCO2e = energy_kwh × intensity ÷ 1000." }

documents:
  - id: finops-framework
    name: FinOps Framework overview
    format: pdf
    url: https://www.finops.org/framework/
    extract_markdown: true
    chunk: true
