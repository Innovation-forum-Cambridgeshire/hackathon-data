# Challenge 04 — Safe in the Open (Civic online safety)
#
# See catalogue/c02-mapping-the-gaps.yml for the fully worked example and the reasoning
# behind the `redistributable` / `licence_reviewed` gates. The build refuses to mirror
# bytes for any source that has not cleared both.

challenge: c04-safe-in-the-open
title: Safe in the Open
domain: Civic online safety
event_date: 2027-03-01
publisher: Innovation Forum
contact: info@inno-forum.co.uk


attribution: >-
  Contains public sector information licensed under the Open Government Licence v3.0.


handle_with_care: >-
  Public information and the participant's explicit consent only. Data protection by design,
  a DPIA before any live data, and a written data-sharing agreement following the ICO Data
  Sharing Code. No private citizens, no bulk collection, no council data or systems.
  Signpost support, never amplify harm.


sensitivity:
  # RESOLVED 2026-08-15 by switching to a synthetic corpus (see synthetic-register and
  # synthetic-abuse below). No real individual's data is published, so personal_data is
  # false as a FACT about what ships — not as an assumption.
  #
  # The real sources remain catalogued as reference-only pointers: teams may read the
  # published registers at source, but we do not mirror, restructure or republish them.
  # Aggregating public records into a queryable dataset is a new processing operation
  # (Catt v UK, ECtHR 2019) and that is precisely what we are declining to do.
  personal_data: false
  special_category: false
  note: >-
    HIGHEST CARE of the five. Councillors acting in public office are public figures in that
    capacity, but abuse directed at them may itself contain special-category data about the
    sender. Never mirror raw social content; mirror only derived, aggregated signals. DPIA
    MUST be complete before any live data work.


sources:
  - id: synthetic-register
    provenance: synthetic
    name: Synthetic councillor register
    publisher: Innovation Forum x R1X
    url: https://github.com/Innovation-forum-Cambridgeshire/hackathon-data
    licence: CC0-1.0
    redistributable: true
    licence_reviewed: true
    licence_evidence: >-
      Authored by Innovation Forum x R1X and released by us under CC0-1.0. No
      third-party rights subsist: the corpus is generated by a seeded generator in
      this repository, not collected, so there is no upstream licensor to clear.
      Recorded 2026-08-15. This is the ONLY category where we are the licensor —
      everything else needs a citation to someone else's published terms.
    generator: synthetic_register   # build/generators/synthetic_register.py
    format: parquet
    approx_size_mb: 3
    notes: >-
      Generated to match the SHAPE of a published register of interests — ward, role,
      committee, declaration category — without deriving from any real member. Seeded
      and reproducible so judging is fair. Replaces the real register entirely.

  - id: synthetic-abuse
    provenance: synthetic
    name: Synthetic abuse / toxicity corpus
    publisher: Innovation Forum x R1X
    url: https://github.com/Innovation-forum-Cambridgeshire/hackathon-data
    licence: CC0-1.0
    redistributable: true
    licence_reviewed: true
    licence_evidence: >-
      Authored by Innovation Forum x R1X and released by us under CC0-1.0. No
      third-party rights subsist: the corpus is generated by a seeded generator in
      this repository, not collected, so there is no upstream licensor to clear.
      Recorded 2026-08-15. This is the ONLY category where we are the licensor —
      everything else needs a citation to someone else's published terms.
    generator: synthetic_abuse      # build/generators/synthetic_abuse.py
    format: parquet
    approx_size_mb: 8
    notes: >-
      Generated messages spanning the abuse categories the challenge targets. Replaces
      any real social content: republishing real posts would breach platform terms and
      risks Protection from Harassment Act 1997, Defamation Act 2013 and misuse of
      private information, none of which a lawful basis under UK GDPR would cure.

  - id: nolan-principles
    provenance: real
    name: Seven Principles of Public Life
    publisher: Committee on Standards in Public Life
    url: https://www.gov.uk/government/publications/the-7-principles-of-public-life
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: true    # D4 cleared 2026-08-15
    licence_evidence: >-
      gov.uk publication footer, checked 2026-08-15: "All content is available under
      the Open Government Licence v3.0, except where otherwise stated."
      https://www.gov.uk/government/publications/the-7-principles-of-public-life
      Plain text guidance with no embedded third-party material, so the standard
      "except where otherwise stated" carve-out does not bite here.
    format: pdf
    approx_size_mb: 1
  - id: council-minutes
    reference_only: true          # read at source; never mirrored or restructured
    provenance: real
    name: Minutes, votes and registers of interests
    publisher: Local authorities
    url: https://www.cambridgeshire.gov.uk/
    licence: review-required   # downgraded from OGL-3.0 by the D4 review, 2026-08-15
    redistributable: false
    licence_reviewed: false
    format: pdf
    approx_size_mb: 250
    notes: >-
      Public record. Mirror as documents plus extracted markdown; no inference about
      individuals beyond their public role.

      UNDER-SPECIFIED, downgraded 2026-08-15. "Local authorities" is not a publisher
      and the URL is a council homepage, so there was nothing to review. Most council
      web content IS OGL — but minutes routinely embed third-party material
      (consultant reports, photographs, quoted correspondence) that the council does
      not own and cannot licence onward, so the OGL claim cannot be made at the level
      of "minutes" as a category. To clear: name the authority and the specific
      publication, and check its own licence statement.
  - id: public-posts
    reference_only: true          # NEVER collected, mirrored or republished
    provenance: real
    name: Local news and public posts
    publisher: Various
    url: https://example.invalid/
    licence: review-required
    redistributable: false
    licence_reviewed: false   # D4 — blocks mirroring until true
    notes: >-
      Consent plus platform terms. NOT mirrored under any circumstances — teams work
      with their own consented collection under the DPIA.
  # DOWNGRADED 2026-08-15 by the D4 review. Was CC-BY-4.0 / redistributable: true
  # against a publisher of "Various open source" and a bare huggingface.co URL.
  #
  # That is un-reviewable in principle, not merely un-reviewed. HuggingFace is a
  # hosting platform carrying tens of thousands of models under licences that are not
  # interchangeable — Apache-2.0 and MIT, but also OpenRAIL variants carrying use
  # restrictions, research-only terms, and outright non-commercial licences. Toxicity
  # classifiers in particular are often trained on corpora with their own
  # redistribution conditions. A single CC-BY-4.0 label across all of that is not a
  # summary, it is a guess, and mirroring on the strength of it could breach several
  # licences at once.
  #
  # Also worth questioning before anyone does the work: models are normally LOADED,
  # not mirrored. Participants can pull from HuggingFace directly, so this may not
  # need redistributable: true at all.
  - id: toxicity-models
    provenance: real
    name: Open abuse / toxicity models
    publisher: Various open source
    url: https://huggingface.co/
    licence: review-required
    redistributable: false
    licence_reviewed: false
    format: json
    approx_size_mb: 5
    notes: >-
      Model cards and evaluation sets only, not training corpora.

      UNDER-SPECIFIED — see the comment above. Not reviewable until specific models
      are named and each licence recorded separately, one source per model.
  - id: support-routes
    provenance: real
    name: Support and reporting routes
    publisher: LGA / policing
    url: https://www.local.gov.uk/
    licence: review-required   # downgraded from OGL-3.0 by the D4 review, 2026-08-15
    redistributable: false
    licence_reviewed: false
    format: csv
    approx_size_mb: 1
    notes: >-
      Signposting directory. Every prototype must be able to point someone at help.

      UNDER-SPECIFIED, downgraded 2026-08-15. "LGA / policing" is two different
      publishers with different terms, against a homepage URL. LGA guidance is
      generally reusable and police material generally OGL, but that has to be
      established per document rather than assumed across a category.

      Worth noting this one is 1 MB of signposting that every prototype needs, so it
      is a small piece of work with a disproportionate blocking effect — a good
      candidate to clear first.

gold_tables:
  - name: synthetic_councillor_register
    description: >-
      Synthetic register of interests matching the shape of a real one. No real member's
      data is present.
    grain: One row per member × declaration
    approx_rows: 4200
    csv_twin: true
    contains_individuals: false   # synthetic — no real person is described
    # Human judgement, not inferred: these are the columns that could re-identify a
    # member by linkage against council websites, press coverage or election results.
    quasi_identifiers: [ward, role, committee, party]
    k_threshold: 5
    generalisation:
      ward: district        # coarser geography preserves rows; suppression is last resort
      committee: committee_type
    # Localism Act 2011 s.32 lets a member withhold a sensitive interest where
    # disclosure risks violence or intimidation. Inferring those gaps would defeat a
    # statutory safeguard — prohibited in the challenge rules, not just discouraged.
    withheld_interests: must_not_be_inferred
    source: synthetic-register
    columns:
      - { name: declaration_id,      type: string,  description: "Unique declaration identifier." }
      - { name: member_id,           type: string,  description: "Synthetic member identifier. Not a real person." }
      - { name: authority,           type: string,  description: "The council the member sits on." }
      - { name: register_held_by,    type: string,  description: "The authority whose Monitoring Officer HOLDS the register. For town and parish councils this is the principal authority, NOT the council itself — writing to the town council would miss the register holder." }
      - { name: ward,                type: string,  description: "Ward. A quasi-identifier — see quasi_identifiers above." }
      - { name: role,                type: string,  description: "Role held, e.g. Councillor, Chair, Cabinet Member." }
      - { name: committee,           type: string,  description: "Committee membership, or (none)." }
      - { name: declaration_category, type: string, description: "Statutory category, or 'Sensitive interest (withheld under s.32)'." }
      - { name: declaration_detail,  type: string,  description: "Free-text detail. NULL where the interest is withheld — genuinely absent, never imputable. Treating this as missing data to fill in defeats a statutory safeguard." }
      - { name: withheld,            type: boolean, description: "True where the interest is lawfully withheld under Localism Act 2011 s.32. The row records THAT an interest exists, never what it is." }
      - { name: registered_date,     type: date,    description: "Date first entered on the register." }
      - { name: last_updated_date,   type: date,    description: "Date last amended." }

  # REASSIGNED 2026-08-15. This was fed by `support-routes`, which the D4 review
  # downgraded to pointer-only ("LGA / policing" is two publishers behind a homepage
  # URL, so it could not be licence-reviewed as written). Rather than lose the table —
  # every c04 prototype must be able to point someone at help — it is generated
  # alongside the register, with SYNTHETIC contact values.
  #
  # The synthetic contacts are not a shortcut. Publishing real helpline numbers in a
  # hackathon corpus invites a prototype to dial one during a demo, and a support line
  # answering a test call is a real cost to a real service. Teams wire the mechanism
  # against these; the mechanism is the assessable part.
  - name: support_directory
    description: >-
      Reporting and support routes by area. Contact values are SYNTHETIC and must never
      be dialled or emailed — see the note above.
    grain: One row per route
    approx_rows: 180
    csv_twin: true
    source: synthetic-register
    columns:
      - { name: route_id,      type: string,  description: "Unique route identifier." }
      - { name: organisation,  type: string,  description: "Organisation offering the route." }
      - { name: category,      type: string,  description: "What the route is for, e.g. Reporting abuse, Mental health support." }
      - { name: contact_type,  type: string,  description: "Telephone, Online form, Email, In person, or 24/7 helpline." }
      - { name: contact_value, type: string,  description: "SYNTHETIC contact detail. Phone numbers use the Ofcom 0808 drama range; addresses use .invalid. Never live." }
      - { name: hours,         type: string,  description: "Opening hours." }
      - { name: coverage,      type: string,  description: "National, Regional, Local authority or Force area." }
      - { name: is_emergency,  type: boolean, description: "True for emergency routes, which must be surfaced differently from advice lines." }
      - { name: notes,         type: string,  description: "Handling note." }

  # ADDED 2026-08-15. The `synthetic-abuse` source was declared, licence-cleared and
  # mirrorable, but NO gold table consumed it — so the corpus the whole challenge turns
  # on had nowhere to land. Found when the generator was written.
  - name: message_signals
    description: >-
      Synthetic message corpus with the derived signals a triage system would act on.
      Contains no real messages and no realistic abuse — severity is carried by
      structure and metadata, not by hostile text. See build/generators/synthetic_abuse.py.
    grain: One row per message
    approx_rows: 24000
    csv_twin: true
    source: synthetic-abuse
    contains_individuals: false
    # The class balance IS the exercise: ~8% flagged, so a classifier predicting
    # "never abusive" scores 92% accuracy and is worthless.
    quasi_identifiers: [target_role, channel]
    k_threshold: 5
    columns:
      - { name: message_id,                   type: string,   description: "Unique message identifier." }
      - { name: received_at,                  type: datetime, description: "When the message arrived, ISO-8601." }
      - { name: channel,                      type: string,   description: "Public comment, Direct message, Email, Forum post or Contact form." }
      - { name: target_role,                  type: string,   description: "The ROLE addressed, never a person." }
      - { name: category,                     type: string,   description: "Triage category. Note 'Robust criticism' is NOT flagged — it is the hard negative, and a classifier that suppresses it has suppressed legitimate scrutiny." }
      - { name: is_flagged,                   type: boolean,  description: "Ground-truth label. ~8% true — the class imbalance is deliberate." }
      - { name: urgency,                      type: string,   description: "low, medium, high or critical." }
      - { name: word_count,                   type: integer,  description: "Words in the message text." }
      - { name: repeat_sender_count,          type: integer,  description: "Prior messages from the same sender. Persistence is a signal that single-message classification cannot see." }
      - { name: references_named_individual,  type: boolean,  description: "Whether a named individual is referenced." }
      - { name: sentiment_score,              type: double,   description: "-1 to 1. Deliberately OVERLAPS between flagged and robust-criticism classes: sentiment alone must not separate them, or the exercise is trivial." }
      - { name: text,                         type: string,   description: "Short synthetic message text, assembled from obviously-templated neutral fragments. Present so a tokeniser can run end to end; NOT a sample of real language." }

documents:
  - id: nolan-principles
    provenance: real
    name: The Seven Principles of Public Life
    format: pdf
    url: https://www.gov.uk/government/publications/the-7-principles-of-public-life
    licence: OGL-3.0
    licence_reviewed: true    # cleared 2026-08-15
    licence_evidence: >-
      gov.uk publication footer, checked 2026-08-15: "All content is available under
      the Open Government Licence v3.0, except where otherwise stated." Plain guidance
      with no embedded third-party material, so the carve-out does not bite. Recorded
      here as well as on the source of the same id, because a document is gated
      independently and a reader of this block should not have to know that.
    extract_markdown: true
    chunk: true
  # NOT CLEARED. ICO content is generally reusable, but ico.org.uk carries its own
  # terms rather than a plain gov.uk OGL footer, and the Data Sharing Code is a
  # statutory code of practice — the kind of document where an out-of-date mirror is
  # actively harmful, because a team would follow guidance we froze. Read at source.
  - id: ico-data-sharing-code
    name: ICO Data Sharing Code of Practice
    format: pdf
    url: https://ico.org.uk/
    extract_markdown: true
    chunk: true
