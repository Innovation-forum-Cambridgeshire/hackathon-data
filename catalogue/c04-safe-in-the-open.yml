# Challenge 04 — Safe in the Open (Civic online safety)
#
# See catalogue/c02-mapping-the-gaps.yml for the fully worked example and the reasoning
# behind the `redistributable` / `licence_reviewed` gates. The build refuses to mirror
# bytes for any source that has not cleared both.

challenge: c04-safe-in-the-open
title: Safe in the Open
domain: Civic online safety
event_date: 2027-03-01
publisher: Innovation Forum
contact: info@inno-forum.co.uk


attribution: >-
  Contains public sector information licensed under the Open Government Licence v3.0.


handle_with_care: >-
  Public information and the participant's explicit consent only. Data protection by design,
  a DPIA before any live data, and a written data-sharing agreement following the ICO Data
  Sharing Code. No private citizens, no bulk collection, no council data or systems.
  Signpost support, never amplify harm.


sensitivity:
  # RESOLVED 2026-08-15 by switching to a synthetic corpus (see synthetic-register and
  # synthetic-abuse below). No real individual's data is published, so personal_data is
  # false as a FACT about what ships — not as an assumption.
  #
  # The real sources remain catalogued as reference-only pointers: teams may read the
  # published registers at source, but we do not mirror, restructure or republish them.
  # Aggregating public records into a queryable dataset is a new processing operation
  # (Catt v UK, ECtHR 2019) and that is precisely what we are declining to do.
  personal_data: false
  special_category: false
  note: >-
    HIGHEST CARE of the five. Councillors acting in public office are public figures in that
    capacity, but abuse directed at them may itself contain special-category data about the
    sender. Never mirror raw social content; mirror only derived, aggregated signals. DPIA
    MUST be complete before any live data work.


sources:
  - id: synthetic-register
    provenance: synthetic
    name: Synthetic councillor register
    publisher: Innovation Forum x R1X
    url: https://github.com/Innovation-forum-Cambridgeshire/hackathon-data
    licence: CC0-1.0
    redistributable: true
    licence_reviewed: true
    format: parquet
    approx_size_mb: 3
    notes: >-
      Generated to match the SHAPE of a published register of interests — ward, role,
      committee, declaration category — without deriving from any real member. Seeded
      and reproducible so judging is fair. Replaces the real register entirely.

  - id: synthetic-abuse
    provenance: synthetic
    name: Synthetic abuse / toxicity corpus
    publisher: Innovation Forum x R1X
    url: https://github.com/Innovation-forum-Cambridgeshire/hackathon-data
    licence: CC0-1.0
    redistributable: true
    licence_reviewed: true
    format: parquet
    approx_size_mb: 8
    notes: >-
      Generated messages spanning the abuse categories the challenge targets. Replaces
      any real social content: republishing real posts would breach platform terms and
      risks Protection from Harassment Act 1997, Defamation Act 2013 and misuse of
      private information, none of which a lawful basis under UK GDPR would cure.

  - id: nolan-principles
    provenance: real
    name: Seven Principles of Public Life
    publisher: Committee on Standards in Public Life
    url: https://www.gov.uk/government/publications/the-7-principles-of-public-life
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: pdf
    approx_size_mb: 1
  - id: council-minutes
    reference_only: true          # read at source; never mirrored or restructured
    provenance: real
    name: Minutes, votes and registers of interests
    publisher: Local authorities
    url: https://www.cambridgeshire.gov.uk/
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: pdf
    approx_size_mb: 250
    notes: >-
      Public record. Mirror as documents plus extracted markdown; no inference about
      individuals beyond their public role.
  - id: public-posts
    reference_only: true          # NEVER collected, mirrored or republished
    provenance: real
    name: Local news and public posts
    publisher: Various
    url: https://example.invalid/
    licence: review-required
    redistributable: false
    licence_reviewed: false   # D4 — blocks mirroring until true
    notes: >-
      Consent plus platform terms. NOT mirrored under any circumstances — teams work
      with their own consented collection under the DPIA.
  - id: toxicity-models
    provenance: real
    name: Open abuse / toxicity models
    publisher: Various open source
    url: https://huggingface.co/
    licence: CC-BY-4.0
    redistributable: true
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: json
    approx_size_mb: 5
    notes: >-
      Model cards and evaluation sets only, not training corpora.
  - id: support-routes
    provenance: real
    name: Support and reporting routes
    publisher: LGA / policing
    url: https://www.local.gov.uk/
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: false   # D4 — blocks mirroring until true
    format: csv
    approx_size_mb: 1
    notes: >-
      Signposting directory. Every prototype must be able to point someone at help.

gold_tables:
  - name: synthetic_councillor_register
    description: >-
      Synthetic register of interests matching the shape of a real one. No real member's
      data is present.
    grain: One row per member × declaration
    approx_rows: 4200
    csv_twin: true
    contains_individuals: false   # synthetic — no real person is described
    # Human judgement, not inferred: these are the columns that could re-identify a
    # member by linkage against council websites, press coverage or election results.
    quasi_identifiers: [ward, role, committee, party]
    k_threshold: 5
    generalisation:
      ward: district        # coarser geography preserves rows; suppression is last resort
      committee: committee_type
    # Localism Act 2011 s.32 lets a member withhold a sensitive interest where
    # disclosure risks violence or intimidation. Inferring those gaps would defeat a
    # statutory safeguard — prohibited in the challenge rules, not just discouraged.
    withheld_interests: must_not_be_inferred
  - name: support_directory
    description: Reporting and support routes by area.
    grain: One row per route
    approx_rows: 180
    csv_twin: true

documents:
  - id: nolan-principles
    provenance: real
    name: The Seven Principles of Public Life
    format: pdf
    url: https://www.gov.uk/government/publications/the-7-principles-of-public-life
    extract_markdown: true
    chunk: true
  - id: ico-data-sharing-code
    name: ICO Data Sharing Code of Practice
    format: pdf
    url: https://ico.org.uk/
    extract_markdown: true
    chunk: true
