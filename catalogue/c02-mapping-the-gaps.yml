# Challenge 02 — Mapping the Gaps (civic data)
#
# The catalogue is the governance backbone: every upstream source carries an explicit
# `redistributable` flag, and the build REFUSES to mirror bytes for any source where it
# is false or unreviewed. Where we cannot redistribute, we ship loader code and a
# pointer instead. This is how the licence position stays true without relying on
# anyone remembering it.
#
# C02 is the cleanest of the five — everything is Open Government Licence — which is
# why it is scheduled first after the sponsor challenge.

challenge: c02-mapping-the-gaps
title: Mapping the Gaps
domain: Civic data
event_date: null # not yet scheduled
publisher: Innovation Forum
contact: info@inno-forum.co.uk

# Reproduced on every derived table and in ATTRIBUTION.md. OGL requires attribution;
# omitting it is a licence breach, so the build fails without it.
attribution: >-
  Contains public sector information licensed under the Open Government Licence v3.0.

handle_with_care: >-
  Deprivation is a measure of access, not a label on people; recorded crime shows what is
  reported, not what happened. Strong entries name these limits. Derived tables must not
  imply otherwise in their column names or descriptions.

sensitivity:
  personal_data: false
  special_category: false
  # Structural rule across the whole programme: no personal or special-category data
  # enters this layer. Everything here is published area-level statistics.
  minimum_geography: LSOA # never below this; no individual-level records

sources:
  - id: synthetic-lsoa
    provenance: synthetic
    name: Synthetic LSOA deprivation and recorded-crime corpus
    publisher: Innovation Forum x R1X
    url: https://github.com/Innovation-forum-Cambridgeshire/hackathon-data
    licence: CC0-1.0
    redistributable: true
    licence_reviewed: true
    licence_evidence: >-
      Authored by Innovation Forum x R1X and released by us under CC0-1.0. No
      third-party rights subsist: generated by a seeded generator in this
      repository, not collected. Recorded 2026-08-15.
    generator: synthetic_lsoa   # build/generators/synthetic_lsoa.py
    format: parquet
    approx_size_mb: 90
    notes: >-
      STAND-IN, added 2026-08-15. c02's three cleared sources (iod2025,
      police-recorded-crime, ons-geography) are all REAL and need fetchers that do
      not exist. Built on the real LSOA grain (33,755 in England) so the join shape
      teams meet is correct now. Carries the deliberate traps the challenge needs —
      see the gold_tables notes.
  - id: iod2025
    provenance: real
    name: Indices of Deprivation 2025
    publisher: Ministry of Housing, Communities and Local Government
    url: https://www.gov.uk/government/collections/english-indices-of-deprivation
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: true # D4 cleared 2026-08-15
    licence_evidence: >-
      gov.uk publication footer, checked 2026-08-15: "All content is available under
      the Open Government Licence v3.0, except where otherwise stated."
      https://www.gov.uk/government/statistics/english-indices-of-deprivation-2019
      OGL v3.0 permits redistribution including commercially, subject to attribution.
    format: xlsx
    approx_size_mb: 40
    notes: LSOA-level. Domain sub-indices as well as the headline IMD rank.

  - id: police-recorded-crime
    provenance: real
    name: Police recorded crime (street-level)
    publisher: Home Office / data.police.uk
    url: https://data.police.uk/docs/
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: true # D4 cleared 2026-08-15
    licence_evidence: >-
      data.police.uk/about/, checked 2026-08-15: published under the Open Government
      Licence v3.0, stated explicitly with a link to the National Archives licence
      text. Acknowledgement is to the Single Online Home National Digital Team.
    format: csv
    approx_size_mb: 900
    notes: >-
      Large. Mirror a curated slice (Cambridgeshire + comparator forces, 24 months)
      rather than the national archive. Full extract stays upstream behind loader code.

  - id: deri
    provenance: real
    name: Digital Exclusion Risk Index
    publisher: Greater Manchester Combined Authority
    url: https://www.gmtableau.nhs.uk/t/GMCA/views/DigitalExclusionRiskIndex/DERI
    licence: review-required
    redistributable: false # ← until D4 confirms; ship loader + pointer only
    licence_reviewed: false
    format: csv
    approx_size_mb: 15
    notes: >-
      Licensing unconfirmed — this is one of the three sources named in decision D4.
      Until reviewed, the build emits a pointer and loader code, never bytes.

  # REVIEWED 2026-08-15 AND HELD — three publishers behind one flag, and they do not
  # agree. This is the same shape as `defra` in c01 and `metoffice` in c05: a category
  # is not a source, and one licence flag cannot describe three governments.
  #
  #   SIMD  (Scottish Government) — OGL v3.0 CONFIRMED. gov.scot footer, checked
  #         2026-08-15: "All content is available under the Open Government Licence
  #         v3.0, except for graphic assets and where otherwise stated." Note that
  #         carve-out is WIDER than the standard gov.uk one — it excludes graphic
  #         assets outright, so charts and map images from the publication are not
  #         covered even though the data is.
  #
  #   NIMDM (NISRA) — NOT CONFIRMED, and this is what holds the whole entry. The NISRA
  #         page states only "© Crown Copyright" with NO licence named. Crown copyright
  #         is an assertion of ownership, not a grant of reuse rights, and it is not
  #         interchangeable with OGL. Northern Ireland material has repeatedly turned
  #         out to carry separate terms — see the NI postcode exclusion recorded on
  #         `ons-geography` above. Contact deprivation@nisra.gov.uk to establish it.
  #
  #   WIMD  (Welsh Government) — not checked.
  #
  # To clear: split into three sources, one per nation. SIMD can go first and unblock
  # the Scottish half; NIMDM should be assumed restricted until NISRA says otherwise.
  - id: devolved-indices
    provenance: real
    name: Devolved deprivation indices (SIMD, WIMD, NIMDM)
    publisher: Scottish Government / Welsh Government / NISRA
    url: https://www.gov.scot/collections/scottish-index-of-multiple-deprivation-2020/
    licence: review-required   # downgraded from OGL-3.0 — see above; only SIMD is confirmed
    redistributable: false
    licence_reviewed: false
    format: csv
    approx_size_mb: 25
    notes: >-
      Four nations, four rulebooks — the indices are NOT directly comparable across
      borders. Any cross-nation gold table must carry a caveat column, not a silent join.

      BUNDLES THREE PUBLISHERS. Reviewed 2026-08-15: SIMD is confirmed OGL, NIMDM
      names no licence at all, WIMD unchecked. Split per nation before clearing.

  - id: ons-geography
    provenance: real
    name: ONS Open Geography Portal
    publisher: Office for National Statistics
    url: https://geoportal.statistics.gov.uk/
    licence: OGL-3.0
    redistributable: true
    licence_reviewed: true # D4 cleared 2026-08-15, WITH the conditions below
    licence_evidence: >-
      ons.gov.uk/methodology/geography/licences, checked 2026-08-15. Digital boundaries
      and lookups are OGL, and the statements in `attribution_required` are quoted from
      that page — OGL attribution alone is NOT sufficient for these products, because
      they contain Ordnance Survey material.
    attribution_required:
      - "Source: Office for National Statistics licensed under the Open Government Licence v.3.0"
      - "Contains OS data (c) Crown copyright and database right 2026"
    format: geojson
    approx_size_mb: 300
    notes: >-
      Boundaries and lookups. Simplify geometries for the gold layer.

      DO NOT MIRROR POSTCODE OR UPRN PRODUCTS. They carry conditions the boundaries do
      not — Royal Mail and GeoPlace acknowledgements, and Northern Ireland postcodes
      (BT prefix) need a separate commercial licence from Land and Property Services.
      Nothing in this challenge needs them, and treating the whole portal as uniformly
      OGL is the specific mistake this note exists to prevent.

# Analysis-ready tables. These are what nearly every team actually uses, and what the
# CSV twins are generated from — which matters because free Tableau Public and every
# non-Microsoft team can only use files.
gold_tables:
  # THREE TRAPS ARE BUILT IN, because this catalogue's handle_with_care asks for
  # them: "Deprivation is a measure of access, not a label on people; recorded
  # crime shows what is reported, not what happened."
  #
  #   1. POPULATION VARIES 4x, so raw counts are close to meaningless — an LSOA of
  #      2,900 out-counts one of 1,000 on headcount alone. Mapping counts produces
  #      a population map. Raw count correlates +0.74 with population; the rate
  #      correlates +0.00.
  #
  #   2. REPORTING PROPENSITY VARIES WITH DEPRIVATION and differs by category, so
  #      for VIOLENCE the recorded gradient RUNS OPPOSITE to the true one. True
  #      incidence rises with deprivation; recorded rate is higher in the least
  #      deprived deciles. A team reading recorded as true will report violence as
  #      an affluent-area problem with a real correlation behind it. Burglary is
  #      the honest comparator — well reported everywhere, so it tracks truth.
  #      The true incidence is deliberately NOT published: publishing it would
  #      make the exercise arithmetic rather than judgement.
  #
  #   3. THE IMD CONTAINS A CRIME DOMAIN, so correlating recorded crime with the
  #      overall rank is partly correlating crime with itself. crime_score is
  #      exposed so a team who notices can exclude it.
  #
  # Column names obey the brief: `recorded_count`, never `crime_count`.
  - name: lsoa_deprivation
    description: >-
      LSOA-level deprivation rank and domain scores. SYNTHETIC stand-in for IoD 2025
      on the real English LSOA grain. A measure of ACCESS in an area — never a
      property of the people living there.
    grain: One row per LSOA
    approx_rows: 33755
    csv_twin: true
    source: synthetic-lsoa
    columns:
      - { name: lsoa_code,                type: string,  description: "LSOA code. Joins to lsoa_crime_monthly." }
      - { name: lsoa_name,                type: string,  description: "LSOA name." }
      - { name: local_authority,          type: string,  description: "Local authority." }
      - { name: region,                   type: string,  description: "English region." }
      - { name: resident_population,      type: integer, description: "Residents. Varies about 4x between LSOAs — THIS is why raw crime counts must be normalised before any area is compared with another." }
      - { name: households,               type: integer, description: "Households." }
      - { name: imd_rank,                 type: integer, description: "Deprivation rank, 1 = MOST deprived. Ranks are ordinal: the gap between rank 1 and 2 is not the gap between 3000 and 3001." }
      - { name: imd_decile,               type: integer, description: "Decile, 1 = most deprived tenth." }
      - { name: income_score,             type: double,  description: "Income domain score." }
      - { name: employment_score,         type: double,  description: "Employment domain score." }
      - { name: education_score,          type: double,  description: "Education domain score." }
      - { name: health_score,             type: double,  description: "Health domain score." }
      - { name: crime_score,              type: double,  description: "Crime domain score. NOTE: this is a COMPONENT of the overall rank, so correlating recorded crime against imd_rank is partly correlating crime with itself. Exclude this domain, or use the domains individually." }
      - { name: barriers_score,           type: double,  description: "Barriers to housing and services domain score." }
      - { name: living_environment_score, type: double,  description: "Living environment domain score." }

  - name: lsoa_crime_monthly
    description: >-
      Counts of crime RECORDED by police, by LSOA, month and category. SYNTHETIC.
      This measures reporting and recording, not incidence — the two differ
      systematically and the difference is not constant across categories.
    grain: One row per LSOA × month × crime category
    approx_rows: 2430360
    csv_twin: false # over the ~1M row threshold — parquet plus a CSV sample
    csv_sample_rows: 1000
    source: synthetic-lsoa
    columns:
      - { name: lsoa_code,      type: string,  description: "LSOA code. Joins to lsoa_deprivation — you need that table for population before any rate can be computed." }
      - { name: month,          type: date,    description: "First day of the month, ISO-8601." }
      - { name: crime_category, type: string,  description: "Recorded crime category. The deprivation gradient DIFFERS by category, and for violence the recorded gradient runs opposite to the underlying one. Compare categories before drawing any conclusion from one." }
      - { name: recorded_count, type: integer, description: "Offences RECORDED that month. Not offences committed. Deliberately named recorded_count. Poisson-noisy, so small LSOAs rank unstably on rate alone." }

  - name: lsoa_digital_exclusion
    description: DERI score joined to deprivation and crime.
    grain: One row per LSOA
    approx_rows: 33755
    csv_twin: true
    blocked_by: deri # not built until the DERI licence position is resolved

documents:
  - id: iod2025-technical
    name: IoD 2025 technical report
    format: pdf
    url: https://www.gov.uk/government/collections/english-indices-of-deprivation
    # Every PDF and Word doc gets a page-anchored markdown mirror plus chunks.jsonl.
    # A model cannot read a PDF over HTTPS; it can read markdown instantly. This saves
    # every AI team the four hours they would otherwise lose to PDF parsing.
    extract_markdown: true
    chunk: true
