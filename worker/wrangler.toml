name = "if-hackathon-data"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = false


# The branded, stable participant-facing hostname. Everything published to teams
# points here — never at github.com directly — so the hosting account underneath
# can change without breaking a single URL anyone has bookmarked.
routes = [
  { pattern = "data.inno-forum.co.uk/*", zone_name = "inno-forum.co.uk" }
]

# Free plan is sufficient: the Worker only proxies and caches. Requests are well
# inside the free allowance at hackathon scale, and GitHub charges nothing for
# release-asset egress, so there is no metered cost anywhere in this path.

# Observability is DISABLED deliberately. Worker logs capture client IP addresses, which
# are personal data under UK GDPR — so enabling it would require a lawful basis, a
# retention period, a privacy-notice entry and an international-transfer assessment, for
# a service whose entire published dataset is anonymised. The cheapest compliance posture
# is to not collect it. Turn this on only alongside those four things.
[observability]
enabled = false

# Smart placement is DISABLED deliberately. It lets Cloudflare relocate where the Worker
# executes, which makes data-residency and transfer assessment harder to state truthfully.
# This Worker only proxies and caches public files, so there is nothing to gain from it.
# [placement]
# mode = "smart"

# The DuckDB-WASM playground, served as a static asset at the root.
#
# `run_worker_first = false` means Cloudflare serves a matching static file BEFORE
# invoking the Worker, and falls through to the Worker for everything else. So "/"
# gets the playground and "/c03-.../v.../gold/x.parquet" is still proxied — no
# routing code needed and the data path is untouched.
#
# THIS TABLE MUST STAY AT THE END OF THE FILE. In TOML every bare key after a
# table header belongs to that table, so putting [assets] above `routes` silently
# turns it into `assets.routes` and the Worker deploys bound to nothing. That
# happened once while writing this.
#
# The page loads DuckDB from a CDN — a third-party request on page load — so it
# CANNOT go on the marketing site, which publishes a claim that it makes none and
# enforces it with a deploy gate. See organisers#11.
[assets]
directory = "public"
not_found_handling = "none"
run_worker_first = false
