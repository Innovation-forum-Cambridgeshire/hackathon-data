<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your team — Innovation Forum × R1X</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: light;
    --bg: #fcfcfb; --panel: #f4f4f2; --rule: #e3e3df;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #6f6e6a;
    --accent: #00863a; --warn: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12211a; --panel: #172b21; --rule: #24402f;
      --ink: #ffffff; --ink-2: #c3d2c7; --ink-3: #93a89a;
      --accent: #35c46f; --warn: #f0834f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 28px 20px 72px;
  }
  main { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
  header img { width: 34px; height: 34px; border-radius: 50%; }
  header .who { flex: 1; min-width: 0; }
  header .name { font-weight: 600; }
  header .login { font-size: 13px; color: var(--ink-3); }
  a.plain { color: var(--ink-3); font-size: 13.5px; }
  h1 { font-size: 27px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--ink-2); margin: 0 0 28px; }
  .count {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin: 0 0 10px;
  }
  .unit {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
    padding: 14px 10px; text-align: center;
  }
  .unit .n {
    font-size: 30px; font-weight: 650; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .unit .l {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-3); margin-top: 6px;
  }
  .deadline { font-size: 13.5px; color: var(--ink-2); margin: 0 0 30px; }
  .deadline strong { color: var(--ink); }
  .card {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: 8px; padding: 18px 20px; margin-bottom: 14px;
  }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card p { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  .links a {
    font-size: 14px; text-decoration: none; color: var(--ink);
    border: 1px solid var(--rule); background: var(--bg);
    padding: 8px 13px; border-radius: 6px;
  }
  .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .empty { border-left: 3px solid var(--warn); }
  [hidden] { display: none !important; }
  .skel { color: var(--ink-3); }
</style>
</head>
<body>
<main>
  <header hidden id="hdr">
    <img id="avatar" alt="" width="34" height="34">
    <div class="who">
      <div class="name" id="name"></div>
      <div class="login" id="login"></div>
    </div>
    <a class="plain" href="/auth/logout">Sign out</a>
  </header>

  <div id="loading" class="skel">Loading your workspace…</div>

  <div id="app" hidden>
    <h1 id="evtitle"></h1>
    <p class="sub">Everything your team needs, in one place.</p>

    <div class="count" id="count">
      <div class="unit"><div class="n" id="d">–</div><div class="l">days</div></div>
      <div class="unit"><div class="n" id="h">–</div><div class="l">hours</div></div>
      <div class="unit"><div class="n" id="m">–</div><div class="l">minutes</div></div>
      <div class="unit"><div class="n" id="s">–</div><div class="l">seconds</div></div>
    </div>
    <p class="deadline">
      until submissions close — <strong id="deadline"></strong>.
      What is on <code>main</code> at that moment is what gets judged.
    </p>

    <div id="teams"></div>
  </div>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);

  const res = await fetch("/api/me", { credentials: "same-origin" });
  if (res.status === 401) { location.replace("/"); }
  const data = await res.json();

  $("loading").hidden = true;
  $("app").hidden = false;
  $("hdr").hidden = false;

  $("avatar").src = data.user.avatar;
  $("name").textContent = data.user.name;
  $("login").textContent = "@" + data.user.login;
  $("evtitle").textContent = data.event.title;
  $("deadline").textContent = data.event.submissionDeadlineLondon;

  // Teams come from GitHub, so there is no roster to fall out of step with it.
  // An empty list is a real state on day one, not an error — say what to do.
  const teams = data.teams || [];
  $("teams").innerHTML = teams.length
    ? teams.map((t) => `
        <div class="card">
          <h2>${escapeHtml(t.name)}</h2>
          <p>Your team's repository and board. Work lands here; this is what gets judged.</p>
          <div class="links">
            <a href="${t.repo}" rel="noopener">Repository</a>
            <a href="${t.repo}/projects" rel="noopener">Board</a>
            <a href="${t.repo}/blob/main/SUBMISSION.md" rel="noopener">SUBMISSION.md</a>
          </div>
        </div>`).join("")
    : `<div class="card empty">
         <h2>No team yet</h2>
         <p>You're signed in, but you haven't been added to a team. That happens at
            kickoff — if the event has started and you still see this, find an organiser.</p>
       </div>`;

  // The deadline is a fixed UTC instant. The clocks go back the day before the
  // event, so it is rendered server-side with the zone named and only the
  // remaining time is computed here.
  const target = Date.parse(data.event.submissionDeadlineUtc);
  function tick() {
    const left = target - Date.now();
    if (left <= 0) {
      $("count").innerHTML = '<div class="unit" style="grid-column:1/-1"><div class="n">Closed</div></div>';
      return;
    }
    const s = Math.floor(left / 1000);
    $("d").textContent = Math.floor(s / 86400);
    $("h").textContent = String(Math.floor((s % 86400) / 3600)).padStart(2, "0");
    $("m").textContent = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    $("s").textContent = String(s % 60).padStart(2, "0");
    setTimeout(tick, 1000);
  }
  tick();

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
</script>
</body>
</html>
